<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread-Lancer - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a href="index.html"><img src="logos.png" alt="Thread-Lancer Logo"></a>
    Thread-Lancer
</header>

<main class="login-page">
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p id="login-subtitle">Please log in to your Customer account.</p>

        <div class="role-toggle">
            <button id="btn-customer" class="toggle-btn active-role" onclick="setRole('customer')">Customer</button>
            <button id="btn-designer" class="toggle-btn" onclick="setRole('designer')">Designer</button>
        </div>

        <form action="login.php" method="POST" id="loginForm">
            <input type="hidden" id="user-role" name="role" value="customer">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-submit-btn">Login</button>
            
            <div class="login-links">
                <a href="#">Forgot Password?</a>
                <a href="register.html">Create an Account</a>
            </div>
        </form>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
