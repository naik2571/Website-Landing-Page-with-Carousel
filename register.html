<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread-Lancer - Create Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <a href="try.html"><img src="logos.png" alt="Thread-Lancer Logo"></a>
    Thread-Lancer
</header>

<main class="login-page">
    <div class="login-box">
        <h2>Create Account</h2>
        <p id="reg-subtitle">Join us to shop custom Zari art.</p>

        <div class="role-toggle">
            <button id="btn-reg-customer" class="toggle-btn active-role" onclick="setRegRole('customer')">Customer</button>
            <button id="btn-reg-designer" class="toggle-btn" onclick="setRegRole('designer')">Designer</button>
        </div>

        <form action="register.php" method="POST" id="registerForm">
            <input type="hidden" id="reg-user-role" name="role" value="customer">

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label for="username">User Name</label>
                <input type="text" id="username" name="username" required placeholder="Enter your user name">
            </div>

            <div class="input-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="email" required placeholder="Enter your email">
            </div>

            <div id="designer-fields" style="display: none;">
                <div class="input-group">
                    <label for="portfolio">Portfolio Link (Optional)</label>
                    <input type="url" id="portfolio" name="portfolio" placeholder="Link to your past artwork">
                </div>
            </div>

            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" required placeholder="Create a secure password">
            </div>

            <button type="submit" class="login-submit-btn">Sign Up</button>
            
            <div class="login-links" style="justify-content: center; margin-top: 20px;">
                <a href="login.html">Already have an account? Log In here</a>
            </div>
        </form>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
